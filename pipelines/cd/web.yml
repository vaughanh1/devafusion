trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

resources:
  pipelines:
    - pipeline: web
      source: devafusion-web-ci
      trigger:
        branches:
          include:
            - develop

variables:
  webAppName: "devafusion-dev"
  resourceGroupName: "rg-devafusion-dev-uks"
  # This pipeline deliberately never runs Terraform (separate web/infra
  # pipelines, ADR-0003), so these can't come from `terraform output`
  # the way the infrastructure CD pipeline's restart step does - they
  # stay as named, labelled literals, same precedent as webAppName.
  postgresqlServerName: "psql-devafusion-dev-uks"
  postgresqlFqdn: "psql-devafusion-dev-uks.postgres.database.azure.com"
  keyVaultName: "kv-devafusion-dev-uks"

stages:
  # Runs unconditionally on every CD run - deliberately not gated on
  # whether src/web/drizzle/** changed. `drizzle-kit migrate` is
  # idempotent (it reads __drizzle_migrations from the live database
  # and only applies whatever isn't already recorded there), so an
  # ordinary deploy with no new migration just pays the fixed
  # firewall-rule open/close cost and finds nothing to do. A git-diff
  # gate was considered and rejected: comparing only against the
  # immediately preceding commit permanently loses track of a pending
  # migration if any single CD run is ever rejected at the approval
  # gate below, times out, or fails downstream - silent drift with no
  # error. The devafusion-dev-migrations environment's manual approval
  # check (configured in Azure DevOps's UI, not this YAML -
  # infrastructure/AGENTS.md) pauses this job before any step runs -
  # the current migration SQL was already printed in the triggering CI
  # run (pipelines/ci/web.yml's "Print current migration SQL for
  # review" step), so the approver has something to review first.
  - stage: ApplyMigration
    displayName: Apply pending database migration

    jobs:
      - deployment: RunMigration
        displayName: Run drizzle-kit migrate
        environment: devafusion-dev-migrations

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureKeyVault@2
                  displayName: Fetch PostgreSQL admin password from Key Vault
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    KeyVaultName: "$(keyVaultName)"
                    SecretsFilter: "postgresql-admin-password-devafusion"

                - task: AzureCLI@2
                  displayName: Open a temporary, named firewall rule for this agent
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      agentIp=$(curl -s https://api.ipify.org)
                      echo "Agent IP: $agentIp"

                      az postgres flexible-server firewall-rule create \
                        --resource-group "$(resourceGroupName)" \
                        --server-name "$(postgresqlServerName)" \
                        --name cd-agent-temp \
                        --start-ip-address "$agentIp" \
                        --end-ip-address "$agentIp"

                - task: UseNode@1
                  displayName: Install Node.js 24
                  inputs:
                    version: "24.x"

                - script: |
                    set -euo pipefail

                    cd "$(Build.SourcesDirectory)/src/web"

                    npm ci

                    # Percent-encode the password before building the
                    # connection string - it may contain characters (@,
                    # :, /, %) that would otherwise corrupt the URL,
                    # exactly why web.tf's own DATABASE_URL app_setting
                    # already runs urlencode(). python3 is preinstalled
                    # on the ubuntu-latest image.
                    encodedPassword=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PG_ADMIN_PASSWORD")
                    # sslmode=verify-full pinned explicitly, mirroring
                    # infrastructure/app/environments/dev/web.tf's own
                    # DATABASE_URL - see that file's comment for why.
                    export DATABASE_URL="postgresql://devafusionadmin:${encodedPassword}@$(postgresqlFqdn):5432/postgres?sslmode=verify-full"

                    # Real root cause of this stage's first failures -
                    # NOT firewall propagation or SSL (both ruled out by
                    # direct testing): azurerm_postgresql_flexible_server_
                    # configuration's azure.extensions="CITEXT"
                    # (infrastructure/app/modules/postgresql/main.tf)
                    # only allowlists the extension server-wide - it
                    # does NOT run CREATE EXTENSION inside any specific
                    # database. Confirmed directly: querying
                    # pg_extension on the live server showed only
                    # plpgsql/pgaadauth/azure - citext was never
                    # actually created, so the identity migration's
                    # `"email" "citext"` column failed with a genuine
                    # Postgres "type citext does not exist" error every
                    # time. drizzle-kit's own CLI never surfaced this -
                    # only found by bypassing it with drizzle-orm's
                    # migrate() function directly, which does propagate
                    # the underlying DrizzleQueryError. Idempotent (IF
                    # NOT EXISTS), so safe to run on every deploy.
                    # Written inside src/web (the current working
                    # directory, right next to its node_modules) rather
                    # than /tmp - Node's ESM resolver looks for
                    # node_modules relative to the IMPORTING FILE's own
                    # location, not the shell's cwd, so `import pg` from
                    # a script under /tmp fails with ERR_MODULE_NOT_FOUND
                    # even though `pg` is installed and CWD has it.
                    # Confirmed as the actual cause of a real CD failure
                    # before applying this fix, not a hypothetical.
                    cat > ./ensure-citext.mjs <<'EOF'
                    import pg from "pg";
                    const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
                    try {
                      await client.connect();
                      await client.query("CREATE EXTENSION IF NOT EXISTS citext;");
                    } finally {
                      await client.end();
                    }
                    EOF
                    node ./ensure-citext.mjs
                    rm ./ensure-citext.mjs

                    # Microsoft's own docs: "Changes to the firewall
                    # configuration of an Azure Database for PostgreSQL
                    # flexible server can take up to five minutes." Kept
                    # as a defensive retry even after the citext fix
                    # above, since the ~10-minute rule propagation this
                    # server was separately observed to take (via
                    # Terraform's own apply log) is a real, independent
                    # risk on a freshly-created firewall rule.
                    maxAttempts=6
                    delaySeconds=10
                    attempt=1
                    until npm run db:migrate; do
                      if [ "$attempt" -ge "$maxAttempts" ]; then
                        echo "drizzle-kit migrate failed after ${attempt} attempts (~5 minutes) - giving up. This may be a real migration/SQL error, not a firewall propagation delay - check the output above."
                        exit 1
                      fi
                      echo "drizzle-kit migrate failed (attempt ${attempt}/${maxAttempts}) - likely firewall-rule propagation delay, retrying in ${delaySeconds}s..."
                      sleep "$delaySeconds"
                      attempt=$((attempt + 1))
                      delaySeconds=$((delaySeconds * 2))
                    done
                  displayName: Run drizzle-kit migrate
                  env:
                    # postgresql-admin-password-devafusion (hyphens
                    # preserved, AzureKeyVault@2's own documented
                    # behaviour) is set by the fetch step above - piped
                    # through an env var here (never echoed) rather than
                    # interpolated directly into YAML, so it never
                    # appears unencoded in a rendered connection string.
                    PG_ADMIN_PASSWORD: "$(postgresql-admin-password-devafusion)"

                # Always runs, regardless of whether the migration
                # itself succeeded or failed - a failed migration must
                # never leave a stray firewall rule behind.
                - task: AzureCLI@2
                  displayName: Close the temporary firewall rule
                  condition: always()
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      az postgres flexible-server firewall-rule delete \
                        --resource-group "$(resourceGroupName)" \
                        --server-name "$(postgresqlServerName)" \
                        --name cd-agent-temp \
                        --yes

  - stage: Web
    displayName: Deploy web application
    dependsOn: ApplyMigration

    jobs:
      - deployment: DeployWeb
        displayName: Deploy web application
        environment: devafusion-dev

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: web
                  artifact: web-application

                - task: AzureWebApp@1
                  displayName: Deploy to Azure App Service
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    appType: webAppLinux
                    appName: "$(webAppName)"
                    package: "$(Pipeline.Workspace)/web/web-application"

                - task: AzureCLI@2
                  displayName: Restart Azure App Service
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az webapp restart --name "$(webAppName)" --resource-group "$(resourceGroupName)"
