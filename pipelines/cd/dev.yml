trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

resources:
  pipelines:
    - pipeline: terraform
      source: devafusion-terraform-ci
      trigger: none

    - pipeline: web
      source: devafusion-web-ci
      trigger: none

variables:
  terraformWorkingDirectory: "$(Build.SourcesDirectory)/infrastructure/app/environments/dev"
  webAppName: "devafusion-dev"

stages:
  # ============================================================
  # TERRAFORM
  #
  # The devafusion-dev environment provides the approval gate.
  # ============================================================
  - stage: Terraform
    displayName: Terraform

    jobs:
      - deployment: TerraformApply
        displayName: Apply Terraform
        environment: devafusion-dev

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: latest

                - download: terraform
                  artifact: terraform-plan

                - task: AzureCLI@2
                  displayName: Terraform apply
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      cd "$(terraformWorkingDirectory)"

                      terraform init -input=false

                      terraform apply \
                        -input=false \
                        "$(Pipeline.Workspace)/terraform/terraform-plan/tfplan"

  # ============================================================
  # WEB
  #
  # Runs only after Terraform has completed successfully.
  # ============================================================
  - stage: Web
    displayName: Deploy web application
    dependsOn: Terraform
    condition: succeeded()

    jobs:
      - deployment: DeployWeb
        displayName: Deploy web application
        environment: devafusion-dev

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: web
                  artifact: web-application

                - task: AzureWebApp@1
                  displayName: Deploy to Azure App Service
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    appType: webAppLinux
                    appName: "$(webAppName)"
                    package: "$(Pipeline.Workspace)/web/web-application"
