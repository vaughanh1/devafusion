trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  terraformWorkingDirectory: "$(Build.SourcesDirectory)/infrastructure/app/environments/dev"
  webAppName: "devafusion-dev"

stages:
  # ============================================================
  # GET LATEST CI ARTIFACTS
  # ============================================================
  - stage: Prepare
    displayName: Prepare deployment

    jobs:
      - job: Prepare
        displayName: Get latest successful CI artifacts

        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Get latest CI runs
            inputs:
              azureSubscription: sc-devafusion-terraform
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                organization="$(System.CollectionUri)"
                project="$(System.TeamProject)"

                echo "Finding latest successful Terraform CI run..."
                terraformRunId=$(
                  az pipelines runs list \
                    --organization "$organization" \
                    --project "$project" \
                    --pipeline-name "devafusion-terraform-ci" \
                    --status completed \
                    --result succeeded \
                    --top 1 \
                    --query "[0].id" \
                    --output tsv
                )

                echo "Finding latest successful Web CI run..."
                webRunId=$(
                  az pipelines runs list \
                    --organization "$organization" \
                    --project "$project" \
                    --pipeline-name "devafusion-web-ci" \
                    --status completed \
                    --result succeeded \
                    --top 1 \
                    --query "[0].id" \
                    --output tsv
                )

                if [ -z "$terraformRunId" ]; then
                  echo "No successful Terraform CI run found."
                  exit 1
                fi

                if [ -z "$webRunId" ]; then
                  echo "No successful Web CI run found."
                  exit 1
                fi

                echo "Terraform CI run: $terraformRunId"
                echo "Web CI run: $webRunId"

                echo "##vso[task.setvariable variable=terraformRunId;isOutput=true]$terraformRunId"
                echo "##vso[task.setvariable variable=webRunId;isOutput=true]$webRunId"
            name: versions

          - task: DownloadPipelineArtifact@2
            displayName: Download Terraform plan
            inputs:
              buildType: specific
              project: "$(System.TeamProject)"
              definition: "devafusion-terraform-ci"
              buildVersionToDownload: specific
              pipelineId: "$(versions.terraformRunId)"
              artifactName: terraform-plan
              targetPath: "$(Pipeline.Workspace)/terraform-plan"

          - task: DownloadPipelineArtifact@2
            displayName: Download web application
            inputs:
              buildType: specific
              project: "$(System.TeamProject)"
              definition: "devafusion-web-ci"
              buildVersionToDownload: specific
              pipelineId: "$(versions.webRunId)"
              artifactName: web-application
              targetPath: "$(Pipeline.Workspace)/web-application"

  # ============================================================
  # TERRAFORM
  # ============================================================
  - stage: Terraform
    displayName: Apply Terraform
    dependsOn: Prepare
    condition: succeeded()

    jobs:
      - deployment: TerraformApply
        displayName: Apply Terraform plan
        environment: devafusion-dev

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: latest

                - task: AzureCLI@2
                  displayName: Terraform apply
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      cd "$(terraformWorkingDirectory)"

                      terraform init -input=false

                      terraform apply \
                        -input=false \
                        "$(Pipeline.Workspace)/terraform-plan/tfplan"

  # ============================================================
  # WEB
  # ============================================================
  - stage: Web
    displayName: Deploy web application
    dependsOn: Terraform
    condition: succeeded()

    jobs:
      - deployment: DeployWeb
        displayName: Deploy web application
        environment: devafusion-dev

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: AzureWebApp@1
                  displayName: Deploy web application
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    appType: webAppLinux
                    appName: "$(webAppName)"
                    package: "$(Pipeline.Workspace)/web-application"

  # ============================================================
  # SMOKE TEST
  # ============================================================
  - stage: SmokeTest
    displayName: Smoke test
    dependsOn: Web
    condition: succeeded()

    jobs:
      - job: SmokeTest
        displayName: Verify application

        steps:
          - script: |
              set -euo pipefail

              url="https://$(webAppName).azurewebsites.net"

              echo "Testing $url"

              for attempt in {1..12}; do
                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 10 \
                  "$url" > /dev/null; then

                  echo "Application is responding."
                  exit 0
                fi

                echo "Application not ready. Attempt $attempt/12."
                sleep 10
              done

              echo "Application failed smoke test."
              exit 1
            displayName: HTTP smoke test
