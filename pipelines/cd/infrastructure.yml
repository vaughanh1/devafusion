trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

resources:
  pipelines:
    - pipeline: infrastructure
      source: devafusion-infrastructure-ci
      trigger:
        branches:
          include:
            - develop

variables:
  terraformWorkingDirectory: "$(Build.SourcesDirectory)/infrastructure/app/environments/dev"

stages:
  - stage: Terraform
    displayName: Apply Terraform

    jobs:
      - deployment: TerraformApply
        displayName: Apply Terraform plan
        environment: devafusion-dev

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: latest

                - download: infrastructure
                  artifact: terraform-plan

                - task: AzureCLI@2
                  displayName: Terraform apply
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      cd "$(terraformWorkingDirectory)"

                      terraform init -input=false

                      terraform apply \
                        -input=false \
                        "$(Pipeline.Workspace)/infrastructure/terraform-plan/tfplan"

                - task: AzureCLI@2
                  displayName: Restart Azure App Service
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      cd "$(terraformWorkingDirectory)"

                      webAppName=$(terraform output -raw web_app_name)
                      resourceGroupName=$(terraform output -raw resource_group_name)

                      az webapp restart \
                        --name "$webAppName" \
                        --resource-group "$resourceGroupName"
