trigger:
  branches:
    include:
      - develop
      - main
  paths:
    include:
      - infrastructure/**
      - pipelines/ci/terraform.yml

pr:
  branches:
    include:
      - develop
  paths:
    include:
      - infrastructure/**
      - pipelines/ci/terraform.yml

pool:
  vmImage: ubuntu-latest

variables:
  - name: terraformWorkingDirectory
    value: "$(Build.SourcesDirectory)/infrastructure/app/environments/dev"
  - name: terraformPlanFile
    value: "tfplan"
  - group: devafusion-google-search-verification

stages:
  - stage: Plan
    displayName: Terraform Plan

    jobs:
      - job: TerraformPlan
        displayName: Terraform init, validate and plan

        steps:
          - checkout: self

          - script: |
              set -euo pipefail
              chmod +x scripts/ci/gitleaks-scan.sh
              ./scripts/ci/gitleaks-scan.sh
            displayName: Scan for secrets (gitleaks)

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: latest

          - task: AzureCLI@2
            displayName: Terraform init, validate and plan
            inputs:
              azureSubscription: sc-devafusion-terraform
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                cd "$(terraformWorkingDirectory)"

                terraform init -input=false
                terraform fmt -check
                terraform validate

                terraform plan \
                  -input=false \
                  -var-file=dev.tfvars \
                  -out="$(terraformPlanFile)"
            env:
              TF_VAR_google_verification_devafusion_com: $(GOOGLE_VERIFICATION_DEVAFUSION_COM)
              TF_VAR_google_verification_devafusion_net: $(GOOGLE_VERIFICATION_DEVAFUSION_NET)

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform plan
            inputs:
              targetPath: "$(terraformWorkingDirectory)/$(terraformPlanFile)"
              artifact: terraform-plan
              publishLocation: pipeline
