trigger:
  branches:
    include:
      - develop
      - main
  paths:
    include:
      - src/web/**
      - pipelines/ci/web.yml

pr:
  branches:
    include:
      - develop
  paths:
    include:
      - src/web/**
      - pipelines/ci/web.yml

parameters:
  # Defaults strictly to chromium to avoid the ~700 MB multi-browser
  # binary download on every run. Pass another value from the "Run
  # Pipeline" dialog on demand (root AGENTS.md, Browser Binary Bandwidth
  # Mitigation) — never changed by editing this file for a one-off run.
  - name: playwrightBrowserTarget
    displayName: Playwright browser target
    type: string
    default: chromium
    values:
      - chromium
      - firefox
      - webkit
  # Ad hoc feature-suite toggles, read directly from process.env by the
  # test runners (src/web/__tests__/AGENTS.md) — flipping these from the
  # "Run Pipeline" variables panel needs no commit to develop.
  - name: testDbActions
    displayName: Run TEST_DB_ACTIONS suite
    type: boolean
    default: false
  - name: testMfaFlows
    displayName: Run TEST_MFA_FLOWS suite
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

# LighthouseCI's own "postgres" service container (declared once here,
# referenced by name via that job's services: key) - real Postgres
# reachable via localhost:5432 on a noncontainer job, Microsoft's own
# documented pattern for exactly this. Scoped as a resource rather than
# an inline container so it stays visible at the top of the file
# alongside the pipeline's other shared declarations.
resources:
  containers:
    - container: postgres
      image: postgres:16
      ports:
        - 5432:5432
      env:
        POSTGRES_PASSWORD: lighthouse-ci-local
      options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

variables:
  webWorkingDirectory: "$(Build.SourcesDirectory)/src/web"
  webArtifactDirectory: "$(Build.ArtifactStagingDirectory)/web"
  PLAYWRIGHT_BROWSER_TARGET: "${{ parameters.playwrightBrowserTarget }}"
  TEST_DB_ACTIONS: "${{ parameters.testDbActions }}"
  TEST_MFA_FLOWS: "${{ parameters.testMfaFlows }}"
  keyVaultName: "kv-devafusion-dev-uks"

stages:
  - stage: Build
    displayName: Build web application

    jobs:
      - job: BuildWeb
        displayName: Build and package Next.js

        steps:
          - checkout: self

          - script: |
              set -euo pipefail
              chmod +x scripts/ci/gitleaks-scan.sh
              ./scripts/ci/gitleaks-scan.sh
            displayName: Scan for secrets (gitleaks)

          # CD's ApplyMigration stage runs `drizzle-kit migrate`
          # unconditionally on every run (it is idempotent - it reads
          # __drizzle_migrations from the live database itself and only
          # applies whatever isn't already recorded there), so this step
          # is purely informational: it prints every migration file
          # currently in the repo so an approver reviewing CD's manual
          # approval gate can see the full current set of SQL, without
          # this pipeline needing to guess which ones are "new" via a
          # fragile git-diff comparison. Zero Azure/DB access here.
          - script: |
              set -euo pipefail

              sqlFiles=$(find src/web/drizzle -maxdepth 1 -name '*.sql' | sort)

              if [ -z "$sqlFiles" ]; then
                echo "No migration files under src/web/drizzle/."
                exit 0
              fi

              echo "===== Migration SQL currently in the repo (CD applies any not yet recorded in __drizzle_migrations) ====="
              for f in $sqlFiles; do
                echo "--- $f ---"
                cat "$f"
                echo ""
              done
              echo "================================================================"
            displayName: Print current migration SQL for review

          - task: UseNode@1
            displayName: Install Node.js 24
            inputs:
              version: "24.x"

          - task: Cache@2
            displayName: Cache npm dependencies
            inputs:
              key: 'npm | "$(Agent.OS)" | $(webWorkingDirectory)/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(webWorkingDirectory)/node_modules

          # ADR-0014: NEXT_PUBLIC_* variables are inlined into the
          # client bundle by `next build` itself, not read at runtime -
          # this applies regardless of whether the reading module is a
          # Server or Client Component, since Next.js's own
          # getDefineEnv() spreads every NEXT_PUBLIC_* variable into
          # both the server and client compiler graphs with no
          # isClient guard (confirmed by inspecting
          # node_modules/next/dist/build/define-env.js and diffing a
          # local build's compiled server chunk before/after setting
          # the var). NEXT_PUBLIC_GA_ID and
          # NEXT_PUBLIC_TURNSTILE_SITE_KEY must both be present in
          # *this* build step's environment, not just Terraform's
          # app_settings, even though google-analytics.tsx has no "use
          # client" directive - confirmed as the real root cause of a
          # live "GA has not been initialized" console warning (GA4
          # silently never rendering) by the same inspection. Neither
          # value is sensitive on its own (the sitekey identifies the
          # Turnstile widget to Cloudflare, not a credential; the GA4
          # ID is a public measurement ID by GA4's own design), but
          # both stay sourced from Key Vault to remain single-sourced
          # with the values Terraform's app_settings also reads,
          # rather than a second, driftable plain-text pipeline
          # variable.
          - task: AzureKeyVault@2
            displayName: Fetch build-time NEXT_PUBLIC_* values from Key Vault
            inputs:
              azureSubscription: sc-devafusion-terraform
              KeyVaultName: "$(keyVaultName)"
              SecretsFilter: "turnstile-site-key-devafusion,google-analytics-ga4-devafusion"

          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              npm ci
              npm run lint
              npm run typecheck
              npm run build

              # Standalone output does not include these automatically.
              cp -R .next/static .next/standalone/.next/static

              if [ -d public ]; then
                cp -R public .next/standalone/public
              fi

              # Package exactly what Azure App Service needs.
              rm -rf "$(webArtifactDirectory)"
              mkdir -p "$(webArtifactDirectory)"

              cp -R .next/standalone/. "$(webArtifactDirectory)/"
            displayName: Build and package application
            env:
              # AzureKeyVault@2 maps hyphens in the secret name to its
              # own env var verbatim (same pattern as
              # postgresql-admin-password-devafusion elsewhere in this
              # repo's pipelines).
              NEXT_PUBLIC_TURNSTILE_SITE_KEY: "$(turnstile-site-key-devafusion)"
              NEXT_PUBLIC_GA_ID: "$(google-analytics-ga4-devafusion)"

          - task: PublishPipelineArtifact@1
            displayName: Publish web application
            inputs:
              targetPath: "$(webArtifactDirectory)"
              artifact: web-application
              publishLocation: pipeline

  - stage: Test
    displayName: Test web application
    dependsOn: Build

    jobs:
      - job: UnitTests
        displayName: Vitest unit and component tests

        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Install Node.js 24
            inputs:
              version: "24.x"

          - task: Cache@2
            displayName: Cache npm dependencies
            inputs:
              key: 'npm | "$(Agent.OS)" | $(webWorkingDirectory)/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(webWorkingDirectory)/node_modules

          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              npm ci
              npm run test:unit -- --reporter=junit --outputFile=coverage/junit.xml --reporter=default
            displayName: Run Vitest with coverage
            env:
              TEST_DB_ACTIONS: $(TEST_DB_ACTIONS)
              TEST_MFA_FLOWS: $(TEST_MFA_FLOWS)

          - task: PublishTestResults@2
            displayName: Publish Vitest results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "coverage/junit.xml"
              searchFolder: "$(webWorkingDirectory)"
              testRunTitle: "Vitest unit tests"

          - task: PublishCodeCoverageResults@2
            displayName: Publish Vitest coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "$(webWorkingDirectory)/coverage/lcov.info"

      - job: E2ETests
        displayName: Playwright end-to-end tests
        dependsOn: []

        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Install Node.js 24
            inputs:
              version: "24.x"

          - task: Cache@2
            displayName: Cache npm dependencies
            inputs:
              key: 'npm | "$(Agent.OS)" | $(webWorkingDirectory)/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(webWorkingDirectory)/node_modules

          # Playwright's own browser binary cache is keyed by version, so
          # a cache hit here skips the ~700 MB re-download that would
          # otherwise happen on every pipeline run (root AGENTS.md,
          # Browser Binary Bandwidth Mitigation).
          - task: Cache@2
            displayName: Cache Playwright browser binaries
            inputs:
              key: 'playwright | "$(Agent.OS)" | $(webWorkingDirectory)/package-lock.json'
              path: $(HOME)/.cache/ms-playwright

          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              npm ci
              npx playwright install --with-deps "$(PLAYWRIGHT_BROWSER_TARGET)"
              npm run build

              cp -R .next/static .next/standalone/.next/static
              if [ -d public ]; then
                cp -R public .next/standalone/public
              fi
            displayName: Build application for E2E
            env:
              # ADR-0014: NEXT_PUBLIC_TURNSTILE_SITE_KEY is inlined at
              # this build step, not read at Playwright's own
              # webServer runtime (which only starts the already-built
              # standalone server, per the identical comment on the
              # main Build stage above) - Cloudflare's own documented
              # dummy "always passes" sitekey, not the real Key
              # Vault-sourced one, since this is a test build.
              NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
              # Left unset deliberately: this is a test build, and an
              # unset NEXT_PUBLIC_GA_ID inlines as falsy, which
              # google-analytics.tsx's own runtime check already
              # treats as "analytics disabled" - no real or dummy
              # GA4 traffic should ever originate from a CI-run
              # Playwright suite.

          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              # Relies on playwright.config.ts's own CI-conditional
              # reporter (junit -> tests-e2e-results/junit.xml + list)
              # rather than an --reporter=junit CLI override, which
              # would replace it with a stdout-only reporter and leave
              # no file for PublishTestResults@2 to ingest below.
              npm run test:e2e
            displayName: Run Playwright end-to-end tests
            env:
              CI: "true"
              PLAYWRIGHT_BROWSER_TARGET: $(PLAYWRIGHT_BROWSER_TARGET)
              TEST_DB_ACTIONS: $(TEST_DB_ACTIONS)
              TEST_MFA_FLOWS: $(TEST_MFA_FLOWS)

          - task: PublishTestResults@2
            displayName: Publish Playwright results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "tests-e2e-results/junit.xml"
              searchFolder: "$(webWorkingDirectory)"
              testRunTitle: "Playwright E2E tests"

          - task: UploadPlaywrightReport@1
            displayName: Publish rich video & trace reports to the Playwright tab
            condition: failed() # Runs only on a build failure to keep storage costs at zero.
            inputs:
              playwrightReportDir: "$(webWorkingDirectory)/playwright-report"

          - task: PublishPipelineArtifact@1
            displayName: Publish Playwright failure artifacts
            condition: failed()
            inputs:
              targetPath: "$(webWorkingDirectory)/tests-e2e/.playwright-output"
              artifact: playwright-failure-artifacts
              publishLocation: pipeline

      - job: VisualRegression
        displayName: Playwright visual regression (Docker font-safe)
        dependsOn: []
        # Runs the official, pinned Playwright image so screenshot
        # baselines are captured against the exact font stack the Ubuntu
        # pipeline agent renders with — eliminates local-OS
        # (Windows/macOS) vs. cloud-runner false-positive diffs (root
        # AGENTS.md, Visual Regression Docker Enforcers).
        container:
          image: mcr.microsoft.com/playwright:v1.62.1-noble
          options: --ipc=host

        steps:
          - checkout: self

          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              npm ci
              npm run build

              cp -R .next/static .next/standalone/.next/static
              if [ -d public ]; then
                cp -R public .next/standalone/public
              fi
            displayName: Build application for visual regression
            env:
              # ADR-0014: the committed baseline only covers the home
              # page, which never mounts TurnstileWidget, so this
              # isn't strictly required today - set anyway for
              # consistency with the other two build steps and so a
              # future baseline covering /sign-up or /log-in doesn't
              # silently inherit this same class of bug.
              NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              # Rely on playwright.config.ts's own CI reporter (junit ->
              # tests-e2e-results/junit.xml + list) rather than overriding
              # --reporter here, which would replace it with a
              # stdout-only junit reporter and break the JUnit file this
              # job's PublishTestResults@2 step depends on.
              npx playwright test --grep @visual
            displayName: Run Playwright visual regression suite
            env:
              CI: "true"
              PLAYWRIGHT_BROWSER_TARGET: $(PLAYWRIGHT_BROWSER_TARGET)

          - task: PublishTestResults@2
            displayName: Publish visual regression results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "tests-e2e-results/junit.xml"
              searchFolder: "$(webWorkingDirectory)"
              testRunTitle: "Playwright visual regression"

          - task: UploadPlaywrightReport@1
            displayName: Publish rich video & trace reports to the Playwright tab
            condition: failed() # Runs only on a build failure to keep storage costs at zero.
            inputs:
              playwrightReportDir: "$(webWorkingDirectory)/playwright-report"

          # Baseline bootstrap workflow (src/web/__tests__/AGENTS.md): a
          # brand-new @visual spec with no committed baseline under
          # tests-e2e/__screenshots__ fails with a "snapshot doesn't
          # exist" diff on its first run. Playwright still writes the
          # actual PNG it rendered inside this pinned Docker image to
          # test-results/ on that failure — publish it so a maintainer
          # can download it and commit it as the new baseline (the only
          # font-safe way to create one, since it must be rendered by
          # this exact image, not a local OS).
          - task: PublishPipelineArtifact@1
            displayName: Publish visual regression baseline candidates
            condition: failed()
            inputs:
              targetPath: "$(webWorkingDirectory)/test-results"
              artifact: visual-regression-baseline-candidates
              publishLocation: pipeline

      - job: LighthouseCI
        displayName: Lighthouse CI (accessibility, best practices, SEO, performance)
        dependsOn: []
        # Real Postgres reachable via localhost:5432 (noncontainer job -
        # Microsoft's own documented pattern, root AGENTS.md's Local
        # Postgres for Migration Testing / src/web/AGENTS.md precedent
        # for this exact image/version; the "postgres" service container
        # itself is declared once at the top-level resources.containers
        # block below and only referenced here by name). Without this,
        # every page's AccountNav mounts authClient.useSession() -> GET
        # /api/auth/get-session -> Better Auth's drizzleAdapter querying
        # a database that doesn't exist, which 500s and trips
        # Lighthouse's errors-in-console audit on every run (found via
        # the exported HTML reports, root AGENTS.md's Log-Driven
        # Development triage) - production always has a real DB, so
        # this was a fixture-environment gap, not a live-site bug.
        services:
          postgres: postgres

        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Install Node.js 24
            inputs:
              version: "24.x"

          - task: Cache@2
            displayName: Cache npm dependencies
            inputs:
              key: 'npm | "$(Agent.OS)" | $(webWorkingDirectory)/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(webWorkingDirectory)/node_modules

          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              npm ci
              npm run build

              cp -R .next/static .next/standalone/.next/static
              if [ -d public ]; then
                cp -R public .next/standalone/public
              fi
            displayName: Build application for Lighthouse
            env:
              # Dummy "always passes" fixture, same rationale as the
              # E2ETests job's identical env var above - .lighthouserc.js
              # deliberately never audits /sign-up or /log-in (Turnstile's
              # third-party script would pollute performance scores), so
              # this only needs to make the build succeed, not resemble
              # production traffic.
              NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

          # Same citext gap docs/adr/0013 found on the live server -
          # azurerm_postgresql_flexible_server_configuration's
          # allowlisting has no equivalent on a fresh postgres:16
          # container either, so the "email" "citext" column in
          # 0000_better_auth_identity_and_mfa.sql needs the extension
          # created before drizzle-kit migrate runs. Idempotent (IF NOT
          # EXISTS), safe to run every time.
          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              cat > ./ensure-citext.mjs <<'EOF'
              import pg from "pg";
              const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
              try {
                await client.connect();
                await client.query("CREATE EXTENSION IF NOT EXISTS citext;");
              } finally {
                await client.end();
              }
              EOF
              node ./ensure-citext.mjs
              rm ./ensure-citext.mjs

              npm run db:migrate
            displayName: Migrate Lighthouse fixture Postgres
            env:
              DATABASE_URL: "postgresql://postgres:lighthouse-ci-local@localhost:5432/postgres"

          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              npx lhci autorun
            displayName: Run Lighthouse CI audits
            env:
              # form-timing-token.ts's HMAC key has no equivalent
              # published test fixture (same rationale as
              # playwright.config.ts's webServer.env) - lhci autorun
              # boots the standalone server itself via
              # .lighthouserc.js's startServerCommand, so it needs this
              # set in its own environment too.
              FORM_TIMING_TOKEN_SECRET: "lighthouse-ci-fixture-key-not-a-real-secret"
              # Real fixture Postgres started above - auth.ts's
              # drizzleAdapter needs this so AccountNav's
              # authClient.useSession() call (mounted on every page via
              # the header) succeeds instead of 500ing.
              DATABASE_URL: "postgresql://postgres:lighthouse-ci-local@localhost:5432/postgres"
              # better-auth throws BetterAuthError without this
              # (create-context.mjs's validateSecret) - a throwaway
              # fixture value, only ever used against the ephemeral
              # CI-local Postgres container above.
              BETTER_AUTH_SECRET: "lighthouse-ci-fixture-better-auth-secret-value-32chars"
              # two-factor-secret-cipher.ts's loadKey() requires exactly
              # 32 raw bytes once base64-decoded - never actually
              # exercised by lhci's 3 audited pages (none touch MFA),
              # but auth.ts's betterAuth({ database: drizzleAdapter(db) })
              # call is evaluated at module load regardless.
              MFA_ENCRYPTION_KEY: "bGlnaHRob3VzZS1jaS1maXh0dXJlLW1mYS1rZXktMzI="
              # Cloudflare's own documented dummy "always passes" secret
              # key (same pair as playwright.config.ts's webServer.env)
              # - auth.ts's captcha plugin reads this at module load via
              # a non-null assertion, so it must be set even though no
              # audited page renders TurnstileWidget.
              TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"

          # lhci's own filenames (lhr-<timestamp>.html, one per run - 9
          # total for 3 pages x 3 runs) don't say which page they're for.
          # Copies only the representative (median) run per page - the
          # same run categories:* assertions above actually gated on -
          # into friendly, page-identifiable filenames so the Report tabs
          # below are readable.
          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              node ../../scripts/ci/lighthouse-rename-reports.mjs \
                --manifest .lighthouseci/manifest.json \
                --out-dir .lighthouseci/renamed
            displayName: Rename Lighthouse reports for readable tabs
            condition: always()

          # blakyaks.azure-pipeline-html-reports ("Html Reports" extension,
          # installed org-wide) - renders each self-contained lhci HTML
          # report as its own tab under this run's Reports section, named
          # from its filename (useFilenameTabs defaults to true for a
          # directory reportDir).
          - task: PublishHtmlReport@1
            displayName: Publish Lighthouse HTML reports
            condition: always()
            inputs:
              reportDir: "$(webWorkingDirectory)/.lighthouseci/renamed"

          - task: PublishPipelineArtifact@1
            displayName: Publish Lighthouse reports
            condition: always()
            inputs:
              targetPath: "$(webWorkingDirectory)/.lighthouseci"
              artifact: lighthouse-reports
              publishLocation: pipeline

