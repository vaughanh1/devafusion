trigger:
  branches:
    include:
      - develop
      - main

pr:
  branches:
    include:
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  webWorkingDirectory: "$(Build.SourcesDirectory)/src/web"
  webArtifactDirectory: "$(Build.ArtifactStagingDirectory)/web"
  webAppName: "devafusion-dev"

stages:
  # ============================================================
  # BUILD
  # ============================================================
  - stage: Build
    displayName: Build web application

    jobs:
      - job: BuildWeb
        displayName: Build and package Next.js

        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Install Node.js 24
            inputs:
              version: "24.x"

          - script: |
              set -euo pipefail

              cd "$(webWorkingDirectory)"

              npm ci
              npm run lint
              npm run typecheck
              npm run build

              # Next.js standalone output does not include static assets
              # and public assets automatically.
              cp -R .next/static .next/standalone/.next/static

              if [ -d public ]; then
                cp -R public .next/standalone/public
              fi

              # Assemble the final deployment artifact.
              rm -rf "$(webArtifactDirectory)"
              mkdir -p "$(webArtifactDirectory)"

              cp -R .next/standalone/. "$(webArtifactDirectory)/"
            displayName: Build and package application

          - task: PublishPipelineArtifact@1
            displayName: Publish web application
            inputs:
              targetPath: "$(webArtifactDirectory)"
              artifact: web-application
              publishLocation: pipeline

  # ============================================================
  # DEPLOY
  #
  # The devafusion-dev environment provides the approval gate.
  # ============================================================
  - stage: Deploy
    displayName: Deploy web application
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployWeb
        displayName: Deploy approved web application
        environment: devafusion-dev

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  displayName: Download web application
                  inputs:
                    artifact: web-application
                    path: "$(Pipeline.Workspace)/web-application"

                - task: AzureWebApp@1
                  displayName: Deploy to Azure App Service
                  inputs:
                    azureSubscription: sc-devafusion-terraform
                    appType: webAppLinux
                    appName: "$(webAppName)"
                    package: "$(Pipeline.Workspace)/web-application"
