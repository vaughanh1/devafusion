# Gitleaks configuration for devafusion.
#
# Extends the default gitleaks rule set (secrets, tokens, private keys) and
# layers a repository-specific allowlist on top to suppress known-safe,
# high-entropy strings that are not secrets (lockfile integrity hashes,
# Terraform provider checksums, generated CSS/theme tokens).
#
# Reference: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for known-safe generated artifacts"
paths = [
  '''package-lock\.json$''',
  '''src/web/package-lock\.json$''',
  '''.*/\.terraform\.lock\.hcl$''',
  '''node_modules/.*''',
  '''\.next/.*''',
  '''\.tools/.*''',
]
# generic-api-key false positive: pipelines/ci/web.yml's LighthouseCI job
# sets a throwaway base64 fixture value for MFA_ENCRYPTION_KEY (decodes
# to exactly 32 bytes, as two-factor-secret-cipher.ts requires) so
# auth.ts's module-level betterAuth() call doesn't throw. It is scoped
# only to that job's ephemeral, per-run local postgres:16 service
# container - never a real key, never used against anything real - but
# its base64 shape matches gitleaks's generic-api-key pattern.
# generic-api-key false positive: pipelines/ci/web.yml's E2ETests job
# sets the same class of throwaway base64 fixture value for
# MFA_ENCRYPTION_KEY (decodes to exactly 32 bytes, as
# encrypted-column-cipher.ts requires) so auth.ts's module-level
# betterAuth() call doesn't throw, and so mfa-flow.spec.ts's real TOTP
# enrolment has a working key when TEST_MFA_FLOWS=true. Scoped only to
# that job's ephemeral, per-run local postgres:16 service container -
# never a real key, never used against anything real - but its base64
# shape matches gitleaks's generic-api-key pattern, same as the
# LighthouseCI fixture above.
regexes = [
  '''bGlnaHRob3VzZS1jaS1maXh0dXJlLW1mYS1rZXktMzI=''',
  '''ZTJlLWNpLWZpeHR1cmUtbWZhLWtleS0zMi1ieXRlcyE=''',
]
